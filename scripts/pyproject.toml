[project]
name = "pitchord-analysis-runtime"
version = "3.0.0"
description = "Reproducible Python dependencies for Pitchord audio analysis"
requires-python = ">=3.10,<3.13"
dependencies = [
  "demucs==4.1.0",
  "torchcrepe==0.0.24",
  "librosa==1.0.0",
  "faster-whisper==1.2.1",
  "omegaconf==2.2.3",
  "ml-collections==1.1.0",
  "beartype==0.14.1",
  "rotary-embedding-torch==0.3.5",
]

[project.optional-dependencies]
cpu = [
  "torch==2.5.1",
  "torchaudio==2.5.1",
]
cuda121 = [
  "torch==2.5.1",
  "torchaudio==2.5.1",
]

[tool.pitchord]
runtime-version = "3"
default-profile = "auto"
cpu-index = "https://download.pytorch.org/whl/cpu"
cuda121-index = "https://download.pytorch.org/whl/cu121"
